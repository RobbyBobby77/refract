[package]
name = "mc-glass-bridge"
version = "1.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Relays Mission Center's magpie IPC as JSON lines for the Liquid Glass frontend"

[dependencies]
libc = "0.2"
serde_json = "1.0"

[dependencies.magpie-types]
path = "../../subprojects/magpie/types"

[dependencies.nng-c-sys]
version = "1.11"
default-features = false

[profile.release]
opt-level = 3
codegen-units = 1
