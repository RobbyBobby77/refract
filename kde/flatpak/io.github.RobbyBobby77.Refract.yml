# Flatpak manifest for Refract. ./build.sh (next to this file) builds it from
# your working tree and writes refract.flatpak; ./flathub-manifest.sh TAG turns
# it into the manifest for Flathub, which builds a tagged release from GitHub.
#
# The UI runs in the sandbox on KDE's runtime with Qt's PySide BaseApp. Like
# Mission Center's Flatpak, the data engine (magpie) and the commands that act
# on the system (systemctl, journalctl, kill, pkexec, xdg-open…) run on the host
# through flatpak-spawn: see refract/sandbox.py.
#
# Every source is pinned so the build works offline, as Flathub requires. When
# magpie or the bridge's Cargo.lock changes, run ./update-cargo-sources.sh.
id: io.github.RobbyBobby77.Refract
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: refract

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # A system monitor has to see the real system, which the sandbox hides:
  # Refract runs its data engine (magpie) and the commands behind its actions
  # (systemctl, journalctl, kill, pkexec, xdg-open) on the host through
  # flatpak-spawn --host, and reads the Plasma wallpaper from there too.
  - --talk-name=org.freedesktop.Flatpak
  # KDE colours and accent
  - --filesystem=xdg-config/kdeglobals:ro

build-options:
  env:
    # We use neither QtWebEngine nor numpy: drop them from the BaseApp.
    BASEAPP_REMOVE_WEBENGINE: '1'
    BASEAPP_DISABLE_NUMPY: '1'

cleanup-commands:
  - /app/cleanup-BaseApp.sh
  # Only needed to build PySide itself or for PyOpenGL, which we don't use.
  - rm -rf /app/lib/libclang* /app/lib/python3*/site-packages/shiboken6_generator*
  - pip3 uninstall -y pyopengl

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - '*.a'

modules:
  - name: python3-psutil
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --no-build-isolation --find-links="file://${PWD}"
        --prefix="${FLATPAK_DEST}" psutil
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/aa/c6/d1ddf4abb55e93cebc4f2ed8b5d6dbad109ecb8d63748dd2b20ab5e57ebe/psutil-7.2.2.tar.gz
        sha256: 0746f5f8d406af344fd547f1c8daa5f5c33dbc293bb8d6a16d80b4bb88f59372

  - name: python3-dbus
    buildsystem: meson
    config-opts:
      - -Dtests=disabled
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/ff/24/63118050c7dd7be04b1ccd60eab53fef00abe844442e1b6dec92dae505d6/dbus-python-1.4.0.tar.gz
        sha256: 991666e498f60dbf3e49b8b7678f5559b8a65034fdf61aae62cdecdb7d89c770
    cleanup:
      - /include
      - /lib/pkgconfig

  - name: refract
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/refract/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - kde/flatpak/install-app.sh
    sources:
      # refract-source: begin (flathub-manifest.sh replaces this with a git tag)
      - type: dir
        path: ../..
        skip:
          - .flatpak-builder
          - target
          - subprojects/magpie/target
          - subprojects/graph-widget/target
          - kde/magpie-bridge/target
          - kde/native/build
          - kde/flatpak/refract.flatpak
          - kde/flatpak/flathub
      # refract-source: end
      # nvtop, which magpie builds for GPU data (its build would download it);
      # the version must match subprojects/magpie/platform-linux/3rdparty/nvtop/nvtop.json
      - type: archive
        url: https://github.com/Syllo/nvtop/archive/3d4a953da02bc18886734613bb9f60ff80669de7.tar.gz
        sha256: e1c8651d299cab61f3e178b9fa97dcf4651f9cc526a51818fca1a47f7838cbd3
        dest: nvtop-3d4a953da02bc18886734613bb9f60ff80669de7
      # Rust crates for magpie and the bridge (./update-cargo-sources.sh)
      - cargo-sources.json
      - type: inline
        dest: cargo
        dest-filename: config.toml
        contents: |
          [source.vendored-sources]
          directory = "/run/build/refract/cargo/vendor"

          [source.crates-io]
          replace-with = "vendored-sources"

          [source."git+https://github.com/pop-os/dbus-settings-bindings.git?rev=87c3c35666b926a24a1e8045fd70be2db1145e34"]
          git = "https://github.com/pop-os/dbus-settings-bindings.git"
          rev = "87c3c35666b926a24a1e8045fd70be2db1145e34"
          replace-with = "vendored-sources"
